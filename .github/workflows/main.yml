name: Build Infernum IDE Portable

on:
  # Uploading/committing the project to the default branch starts both builds automatically.
  push:
    branches: [main, master]
    tags: ['v*']
  # Can also be started manually from the GitHub Actions page.
  workflow_dispatch:
    inputs:
      vscode_ref:
        description: VS Code OSS branch, tag or commit
        required: false
        default: main

permissions:
  contents: read

concurrency:
  group: infernum-ide-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    name: Linux x64 Portable
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      VSCODE_REF: ${{ inputs.vscode_ref || 'main' }}
    steps:
      - name: Get Infernum IDE source
        uses: actions/checkout@v7

      # Node/pnpm are installed only inside GitHub's temporary build machine.
      - name: Install Node.js required by VS Code build
        uses: actions/setup-node@v7
        with:
          node-version: '24.22.1'
      - name: Install pnpm required by VS Code upstream
        uses: pnpm/action-setup@v6
        with:
          version: '12.16.0'
          run_install: false
      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libx11-dev libxkbfile-dev libsecret-1-dev libkrb5-dev libnss3 libatk1.0-0 libatk-bridge2.0-0 libxss1 libasound2 libasound2-dev libgbm-dev libgtk-3-dev libnotify-dev
      - name: Build Linux portable application
        run: node scripts/build-ide.mjs --target linux-x64
      - name: Upload Linux portable archive
        uses: actions/upload-artifact@v6
        with:
          name: Infernum-IDE-Linux-x64-Portable
          path: dist/releases/Infernum-IDE-linux-x64-portable.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  build-windows:
    name: Windows x64 Portable
    runs-on: windows-2022
    timeout-minutes: 360
    env:
      VSCODE_REF: ${{ inputs.vscode_ref || 'main' }}
    steps:
      - name: Get Infernum IDE source
        uses: actions/checkout@v7
      # Node/pnpm are installed only inside GitHub's temporary build machine.
      - name: Install Node.js required by VS Code build
        uses: actions/setup-node@v7
        with:
          node-version: '24.22.1'
      - name: Install pnpm required by VS Code upstream
        uses: pnpm/action-setup@v6
        with:
          version: '12.16.0'
          run_install: false
      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - name: Build Windows portable application
        run: node scripts/build-ide.mjs --target win32-x64
      - name: Upload Windows portable archive
        uses: actions/upload-artifact@v6
        with:
          name: Infernum-IDE-Windows-x64-Portable
          path: dist/releases/Infernum-IDE-win32-x64-portable.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
