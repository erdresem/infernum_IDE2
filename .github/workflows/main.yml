
name: Build Infernum IDE

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows Portable
    runs-on: windows-2022
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'

      - uses: pnpm/action-setup@v4
        with:
          version: '12.16.0'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Build Infernum IDE
        shell: pwsh
        run: |
          node scripts/build-ide.mjs --target win32-x64

      - uses: actions/upload-artifact@v4
        with:
          name: Infernum-IDE-Windows-Portable
          path: dist/releases/Infernum-IDE-win32-x64-portable.zip

  linux:
    name: Linux Portable
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'

      - uses: pnpm/action-setup@v4
        with:
          version: '12.16.0'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libx11-dev libxkbfile-dev libsecret-1-dev libkrb5-dev libnss3 libatk1.0-0 libatk-bridge2.0-0 libxss1 libasound2 libasound2-dev libgbm-dev libgtk-3-dev libnotify-dev

      - name: Build Infernum IDE
        run: node scripts/build-ide.mjs --target linux-x64

      - uses: actions/upload-artifact@v4
        with:
          name: Infernum-IDE-Linux-Portable
          path: dist/releases/Infernum-IDE-linux-x64-portable.tar.gz
